# Triaged advisories in development-only tooling. `pnpm why --prod` is empty for every package
# below; the paths were traced with `pnpm why` on 2026-10-30. Nothing here ships: production
# dependencies are gated separately by `pnpm audit --prod`, which has no exceptions. Each entry
# expires, so it is re-reviewed rather than forgotten; a new advisory, or any advisory past its
# date, fails `pnpm audit:deps`. Lighthouse CI runs only `collect`, `upload` (filesystem) and
# `assert`, locally, against this repository's own build.

