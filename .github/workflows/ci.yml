name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Confidential client names and banned terms, newline-separated. Required: the
      # confidentiality checks fail in CI without it, by design (see HARNESS.md).
      CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pdftotext (the resume's second parser)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Lint, typecheck, unit tests and the resume checks
        run: pnpm verify

      - run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end on Chromium, desktop and mobile (builds and serves the production site)
        run: pnpm exec playwright test --project=chromium-desktop --project=chromium-mobile

      - name: Production dependency audit (no exceptions)
        run: pnpm audit --prod --audit-level=low

      - name: osv-scanner over the whole lockfile (documented dev-only exceptions in osv-scanner.toml)
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

      - name: Keep the Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
